name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check silentpivot scripts tests

      - name: Byte-compile all sources
        run: python -m compileall -q silentpivot scripts tests

      - name: Run offline test suite
        # Live/network checks (-m live) are intentionally excluded — they hit real
        # external services and would make CI flaky. They're covered by scripts/selftest.py
        # and `pytest -m live` when run against a real network.
        run: pytest -q
